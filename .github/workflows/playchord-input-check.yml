name: playchord-input-check

on:
  push:
    branches: [playchord-input-check]
    paths: ["playchord-input-check/**", ".github/workflows/playchord-input-check.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: playchord-input-check
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests and debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :audio-input:testDebugUnitTest :app:testDebugUnitTest :app:assembleDebug
      - name: APK checksum
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: |
            playchord-input-check/app/build/outputs/apk/debug/app-debug.apk
            playchord-input-check/app/build/outputs/apk/debug/app-debug.apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            playchord-input-check/audio-input/build/test-results/
            playchord-input-check/app/build/test-results/
            playchord-input-check/audio-input/build/reports/tests/
            playchord-input-check/app/build/reports/tests/

  device-tests:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: playchord-input-check
          script: chmod +x gradlew && ./gradlew --no-daemon --stacktrace :app:connectedDebugAndroidTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-test-results
          path: |
            playchord-input-check/app/build/outputs/androidTest-results/
            playchord-input-check/app/build/reports/androidTests/
